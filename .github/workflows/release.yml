name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Release merged pull request
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: release-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Require merged pull request and create release tag
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pull_requests_file="$RUNNER_TEMP/pull-requests.json"
          release_notes_file="$RUNNER_TEMP/release-notes.md"
          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" \
            > "$pull_requests_file"

          bash scripts/release-notes.sh "$pull_requests_file" "$release_notes_file"

          tag="$(bash scripts/release-tag.sh tag)"
          bash scripts/release-tag.sh ensure
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "$tag"

          echo "release_notes=$release_notes_file" >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --release-notes ${{ steps.metadata.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
