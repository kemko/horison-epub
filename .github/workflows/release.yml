name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release merged pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Require merged pull request and create release tag
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pull_requests_file="$RUNNER_TEMP/pull-requests.json"
          release_notes_file="$RUNNER_TEMP/release-notes.md"
          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            > "$pull_requests_file"

          merged_count="$(jq '[.[] | select(.merged_at != null)] | length' "$pull_requests_file")"
          if [ "$merged_count" -eq 0 ]; then
            echo "Release requires a merged pull request for ${GITHUB_SHA}." >&2
            exit 1
          fi

          jq -r '
            map(select(.merged_at != null))
            | .[0]
            | "## Pull request #\(.number): \(.title)\n\n\(.body // "_No description provided._")\n\n- Author: @\(.user.login)\n- Link: \(.html_url)\n"
          ' "$pull_requests_file" > "$release_notes_file"

          tag="$(bash scripts/release-tag.sh tag)"
          bash scripts/release-tag.sh ensure
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_notes=$release_notes_file" >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --release-notes ${{ steps.metadata.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
